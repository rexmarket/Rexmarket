
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Rexmarket</title>

    
    <link rel="stylesheet" href="Rexmarket.css">
</head>
<body>

    

<div class="header">

    <img src="LogoRm.png" alt="Logo Rexmarket" class="logo">

    <div class="search-box">
        <input type="text" placeholder="Cari..." id="searchInput">

        <button type="button" class="search-btn" aria-label="Cari">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="6.5"></circle>
                <path d="M15.5 15.5L21 21"></path>
            </svg>
        </button>
    </div>

    <button class="cs-button" type="button" aria-label="Customer Service">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 13v-2a9 9 0 0 1 18 0v2"></path>
        <path d="M3 12h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>

        <path d="M16 19a5 5 0 0 1-4 2"></path>
    </svg>
    </button>

</div>

    
<!-- BANNER CAROUSEL -->
<section class="banner-section">
    <div class="banner-slider" id="bannerSlider">
        <div class="banner-track" id="bannerTrack">
            <div class="banner-slide">
                <img src="Banner1.png" alt="Banner 1">
            </div>

            <div class="banner-slide">
                <img src="Banner2.png" alt="Banner 2">
            </div>

            <div class="banner-slide">
                <img src="Banner3.png" alt="Banner 3">
            </div>
        </div>
    </div>

    <div class="banner-dots" id="bannerDots">
        <button class="banner-dot active" aria-label="Banner 1"></button>
        <button class="banner-dot" aria-label="Banner 2"></button>
        <button class="banner-dot" aria-label="Banner 3"></button>
    </div>
</section>

    <a href="transaksi.html" class="nav-item">
